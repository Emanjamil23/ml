<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Detection System</title>
  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main container to center the form card on the page -->
  <div class="container">
    <div class="card">
      <!-- Header Section -->
      <h1 class="title">Fraud Detection System</h1>
      <p class="subtitle">Enter transaction details to check whether the transaction is potentially fraudulent.</p>

      <!-- Transaction Input Form -->
      <form id="fraudForm">

        <!-- 1. Transaction Type Dropdown -->
        <div class="form-group">
          <label for="type">Transaction Type</label>
          <select id="type" name="type" required>
            <option value="PAYMENT" selected>PAYMENT</option>
            <option value="TRANSFER">TRANSFER</option>
            <option value="CASH_OUT">CASH_OUT</option>
            <option value="DEBIT">DEBIT</option>
            <option value="CASH_IN">CASH_IN</option>
          </select>
        </div>

        <!-- 2. Amount & 3. Step Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" value="9839.64" required>
          </div>

          <div class="form-group">
            <label for="step">Step</label>
            <input type="number" id="step" name="step" value="1" min="1" required>
          </div>
        </div>

        <!-- 4. Old Origin Balance & 5. New Origin Balance Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="oldbalanceOrg">Old Origin Balance</label>
            <input type="number" id="oldbalanceOrg" name="oldbalanceOrg" step="0.01" value="170136.0" required>
          </div>

          <div class="form-group">
            <label for="newbalanceOrig">New Origin Balance</label>
            <input type="number" id="newbalanceOrig" name="newbalanceOrig" step="0.01" value="160296.36" required>
          </div>
        </div>

        <!-- 6. Old Destination Balance & 7. New Destination Balance Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="oldbalanceDest">Old Destination Balance</label>
            <input type="number" id="oldbalanceDest" name="oldbalanceDest" step="0.01" value="0.0" required>
          </div>

          <div class="form-group">
            <label for="newbalanceDest">New Destination Balance</label>
            <input type="number" id="newbalanceDest" name="newbalanceDest" step="0.01" value="0.0" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn">Check Transaction</button>
      </form>

      <!-- Result Box: Displays status, legitimate (green), fraudulent (red), or error -->
      <div id="resultBox" class="result-box hidden"></div>
    </div>
  </div>

  <!-- Link to external JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
